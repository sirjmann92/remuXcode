name: Publish Docker image

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - 'QUICKSTART.md'
      - 'ROADMAP.md'
      - 'docs/**'
      - 'images/**'
      - 'tests/**'
      - 'legacy/**'
  workflow_dispatch:

jobs:
  # Gate publishing on the same lint suite that runs on PRs — a direct
  # push to main must pass linters before an image/release is cut.
  lint:
    uses: ./.github/workflows/linters.yml

  build:
    needs: lint
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Auto-bumps the patch version on every publish: X.Y.Z becomes X.Y.(Z+1).
      # To cut a minor or major release instead, include "#minor" or
      # "#major" as a standalone word in a commit message being pushed:
      #   #minor → X.Y.Z becomes X.(Y+1).0   (new feature)
      #   #major → X.Y.Z becomes (X+1).0.0   (breaking change)
      # Written without concrete version numbers so the example cannot go
      # stale as the project releases. Only commit messages are scanned,
      # never file contents, so this comment cannot promote a release.
      - name: Determine next version from tags
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)

          if [ -n "$LATEST_TAG" ]; then
            CURRENT="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

            # Scan commit messages since the last release for a bump keyword.
            # Anchored to word boundaries so an incidental substring — the
            # near-misses "#minority" and "#majorly", or a keyword glued to
            # surrounding text — cannot promote a release.
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=%B)
            if printf '%s' "$COMMITS" | grep -qiE '(^|[^[:alnum:]_])#major([^[:alnum:]_]|$)'; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
              echo "Bump keyword found: major"
            elif printf '%s' "$COMMITS" | grep -qiE '(^|[^[:alnum:]_])#minor([^[:alnum:]_]|$)'; then
              MINOR=$((MINOR + 1)); PATCH=0
              echo "Bump keyword found: minor"
            else
              PATCH=$((PATCH + 1))
              echo "No bump keyword found; defaulting to patch"
            fi
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          else
            NEW_VERSION="2.0.0"
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $NEW_VERSION"

      - name: Create version tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},priority=1000
            type=raw,value=latest,priority=900
            type=sha,prefix=,format=long,priority=200

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # actionlint:ignore
          password: ${{ secrets.DOCKERHUB_TOKEN }} # actionlint:ignore

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: |
            type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
