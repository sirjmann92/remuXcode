repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '.*\.md$'
      - id: end-of-file-fixer
        exclude: '.*\.md$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        types: [shell]
        args: ['-x']

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: svelte-check
        name: svelte-check
        entry: bash -c "cd frontend && npx svelte-check --tsconfig ./tsconfig.json"
        language: system
        types_or: [ts, svelte]
        pass_filenames: false

      # Runs the Biome that npm installed, via the same `npm run lint` a
      # developer runs by hand, so there is exactly one Biome version in the
      # repo: frontend/package.json. It used to be declared here as well (a
      # `rev` plus an `additional_dependencies` pin) because pre-commit
      # fetches its own hermetic copy and never looks at frontend/
      # node_modules -- which is how this repo once enforced 2.2.4 against a
      # declared 2.5.11, nine releases apart and silently (issue #81).
      #
      # What Biome looks at is now biome.json's files.includes, not a regex
      # here. Keeping that scoping in this file meant `npm run lint` had no
      # scoping at all: it swept frontend/.svelte-kit/ and reported ~5600
      # diagnostics, so nobody could use it.
      - id: biome-check
        name: biome check
        entry: bash -c "cd frontend && npm run lint"
        language: system
        types_or: [ts, tsx, javascript, jsx, json, svelte]
        pass_filenames: false
