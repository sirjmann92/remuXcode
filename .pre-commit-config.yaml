repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '.*\.md$'
      - id: end-of-file-fixer
        exclude: '.*\.md$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        types: [shell]
        args: ['-x']

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: svelte-check
        name: svelte-check
        entry: bash -c "cd frontend && npx svelte-check --tsconfig ./tsconfig.json"
        language: system
        types_or: [ts, svelte]
        pass_filenames: false

      - id: check-biome-pins
        name: check biome version pins agree
        entry: python3 scripts/check_biome_pins.py
        language: system
        files: '^(frontend/package(-lock)?\.json|\.pre-commit-config\.yaml|biome\.json)$'
        pass_filenames: false

  # Both pins below must match "@biomejs/biome" in frontend/package.json.
  # The rev is what actually gates CI; the npm pin only governs `npm run
  # lint`, which CI never runs. When they drift, the gate silently enforces
  # the older ruleset. The check-biome-pins hook above fails the run if so.
  - repo: https://github.com/biomejs/pre-commit
    rev: 'v2.5.11'
    hooks:
      - id: biome-check
        # Scoped to source files rather than a bare ^frontend/. Biome gained
        # HTML/SVG support after 2.2.4, so a bare prefix now sweeps in files
        # the old pin silently skipped:
        #   - app.html / favicon.svg: attributes get reordered, a trailing
        #     space is emitted before '>', the pre-paint theme script's
        #     function expression is rewritten, and noSvgWithoutTitle fails
        #     on the favicon. Linting markup is a separate decision from
        #     this version bump.
        #   - app.css: the only CSS file, and biome.json already excludes it
        #     twice. Passing it explicitly bypasses experimentalScannerIgnores
        #     and the parser rejects Tailwind's @plugin before the override's
        #     disabled linter/formatter applies.
        files: '^frontend/.*\.(jsx?|tsx?|c(js|ts)|m(js|ts)|jsonc?|svelte)$'
        additional_dependencies:
          - '@biomejs/biome@2.5.11'

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [svelte-check]
  submodules: false
